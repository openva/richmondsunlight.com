; Disable persistent connections to prevent connection slot exhaustion
mysqli.allow_persistent = Off
mysqli.max_persistent = 0
mysqli.max_links = -1

; Enable OPcache for better PHP performance (reduces load, indirectly helps DB)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Enable JIT compilation (requires PHP 8.0+)
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Disable PHP exposure in HTTP headers for security
expose_php = Off

; Mail configuration for Amazon SES via Postfix
; Use sendmail (which Postfix provides) with -t flag to read headers from message
sendmail_path = /usr/sbin/sendmail -t -i
