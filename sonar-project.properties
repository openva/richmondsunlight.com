# must be unique in a given SonarQube instance
sonar.projectKey=openva_richmondsunlight.com
sonar.organization=openva
# this is the name and version displayed in the SonarQube UI. Was mandatory prior to SonarQube 6.1.
sonar.projectName=richmondsunlight.com
sonar.projectVersion=1.0
 
# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set. 
sonar.sources=.
sonar.exclusions=htdocs/includes/vendor/**,htdocs/js/vendor/**,htdocs/js/scriptaculous/**,htdocs/js/flowplayer/**,htdocs/js/flowplayer-3.2.18/**,htdocs/js/flowplayer-6.0.5/**,htdocs/js/sorttable.js,deploy/database.sql,htdocs/admin/apc.php,deploy/mysql/**,htdocs/admin/**,htdocs/admin/video/**,htdocs/admin/comments/**,coverage/**,zap-reports/**,.scannerwork/**,deploy/tests/**,deploy/browser-tests/**,tests/**,**/node_modules/**

# The tests, which are analyzed as tests rather than counted as code that needs test coverage.
# (They're excluded from the sources above, because a file can't be both.)
sonar.tests=deploy/tests,deploy/browser-tests,tests
sonar.test.exclusions=**/node_modules/**,deploy/browser-tests/test-results/**,deploy/browser-tests/playwright-report/**

# Test coverage, as reported by PHPUnit (see deploy/tests/run-all.sh)
sonar.php.coverage.reportPaths=coverage/clover.xml
