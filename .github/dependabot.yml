version: 2
updates:
  # Check Composer packages once a month, and gather every minor and patch update into a single
  # pull request. Major updates, which may break things, still get a pull request each.
  #
  # Security updates aren't affected by this: Dependabot opens those as soon as an advisory is
  # published, whatever the schedule, so long as security updates are enabled in the repository's
  # settings (Settings → Advanced Security → Dependabot security updates).
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
      time: "10:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
