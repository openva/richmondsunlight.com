name: Deploy Process

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Redeploy at 4 AM every day

# Prevent multiple deployments running at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set branch name as env var
        run: echo "GITHUB_REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - uses: Firenza/secrets-to-env@v1.2.0
        with:
          secrets: ${{ toJSON(secrets) }}
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, curl, memcached
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apt-transport-https \
            ca-certificates \
            gnupg-agent \
            gnupg \
            gnupg2 \
            zip

      - name: Ensure PHP syntax is valid
        run: find htdocs -name '*.php' -print0 | xargs -0 -n1 -P8 php -l
            
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      
      - name: Install Node dependencies
        working-directory: htdocs/js/vendor
        run: yarn install && yarn build
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker images with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Web.Dockerfile
          push: false
          tags: rs_web:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
      - name: Move new cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      
      - name: Run Docker environment
        run: ./docker-run.sh
      
      - name: Run tests
        id: tests
        run: deploy/tests/run-all.sh
        continue-on-error: true
      
      - name: Stop Docker
        if: always()
        run: ./docker-stop.sh
      
      - name: Populate secrets and compress
        run: |
          ./deploy/branch_deploy.sh
          ./deploy/config_variables.sh
          ./deploy/aws_credentials.sh
          zip -qr rs-web-deploy . --exclude *.git* *.scannerwork*
          mkdir -p upload
          mv rs-web-deploy.zip upload/
          
      - name: Configure deployment type
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            ./deploy/increase_verbosity.sh
            cp appspec-staging.yml appspec.yml
            echo Deployment configured for staging
          elif [ "$GITHUB_REF_NAME" = "deploy" ]; then
            cp appspec-deploy.yml appspec.yml
            echo Deployment configured for production
          else
            echo "No deployment configuration for branch: $GITHUB_REF_NAME"
            exit 0
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: codebase
          path: upload/
          retention-days: 1
          if-no-files-found: error

    outputs:
      branch: ${{ steps.vars.outputs.branch }}

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: codebase
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1
          
      - name: Deploy to staging
        if: github.ref_name == 'master'
        run: |
          aws deploy push \
            --application-name RS-Web \
            --s3-location s3://deploy.richmondsunlight.com/rs-web-staging.zip \
            --ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Web \
            --deployment-group-name RS-Web-Staging \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-web-staging.zip,bundleType=zip
            
      - name: Deploy to production
        if: github.ref_name == 'deploy'
        run: |
          aws deploy push \
            --application-name RS-Web \
            --s3-location s3://deploy.richmondsunlight.com/rs-web-deploy.zip \
            --ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Web \
            --deployment-group-name RS-Web-Fleet \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-web-deploy.zip,bundleType=zip
