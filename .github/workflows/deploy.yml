name: Deploy Process
permissions:
  contents: read
on:
  push:
    branches: [master, deploy]
  pull_request:
    branches: [master, deploy]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Redeploy at 4 AM every day

# Prevent multiple deployments running at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint_unit:
    name: Lint and Build Assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set branch name as env var
        run: echo "GITHUB_REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mysqli, curl, memcached

      - name: Ensure Composer cache dir exists
        run: mkdir -p ~/.composer/cache

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Ensure PHP syntax is valid
        run: find htdocs -name '*.php' -print0 | xargs -0 -n1 -P8 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache Yarn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            htdocs/js/vendor/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Node dependencies
        working-directory: htdocs/js/vendor
        run: yarn install --ignore-scripts && yarn build

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: lint_unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set branch name as env var
        run: echo "GITHUB_REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mysqli, curl, memcached

      - name: Ensure Composer cache dir exists
        run: mkdir -p ~/.composer/cache

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache Yarn dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            htdocs/js/vendor/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Node dependencies
        working-directory: htdocs/js/vendor
        run: yarn install --ignore-scripts && yarn build

      - name: Determine API repo head
        id: api_ref
        run: echo "sha=$(git ls-remote https://github.com/openva/rs-api.git refs/heads/master | cut -f1)" >> $GITHUB_OUTPUT

      - name: Cache API checkout
        id: api_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: api
          key: ${{ runner.os }}-api-${{ steps.api_ref.outputs.sha }}

      - name: Clone API repo if not cached
        if: steps.api_cache.outputs.cache-hit != 'true'
        run: |
          rm -rf api
          git clone --depth 1 https://github.com/openva/rs-api.git api

      - name: Setup Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --debug

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker images with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Web.Dockerfile
          push: false
          load: true
          tags: rs_web:ci
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Run Docker environment
        run: ./docker-run.sh

      - name: Run tests
        id: tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.ref_name }}" = "deploy" ]; }; then
            ./docker-tests.sh --zap-full-scan
          else
            ./docker-tests.sh
          fi

      - name: Stop Docker
        if: always()
        run: ./docker-stop.sh

      - name: Configure deployment type
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            ./deploy/increase_verbosity.sh
            cp appspec-staging.yml appspec.yml
            echo Deployment configured for staging
          elif [ "$GITHUB_REF_NAME" = "deploy" ]; then
            cp appspec-deploy.yml appspec.yml
            echo Deployment configured for production
          else
            echo "No deployment configuration for branch: $GITHUB_REF_NAME"
            exit 0
          fi

      # Secrets are deliberately NOT populated here: workflow artifacts on a
      # public repository can be downloaded by anyone. They're added in the
      # deploy job, immediately before the code is pushed to AWS.
      - name: Compress codebase
        if: env.GITHUB_REF_NAME == 'master' || env.GITHUB_REF_NAME == 'deploy'
        run: zip -r codebase.zip . -x ".git/*" ".pw-browsers/*" "deploy/browser-tests/*"

      - name: Upload codebase
        if: env.GITHUB_REF_NAME == 'master' || env.GITHUB_REF_NAME == 'deploy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codebase
          path: codebase.zip
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to AWS
    needs: [lint_unit, integration]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codebase
          path: .

      - name: Unzip codebase
        run: unzip -q codebase.zip && rm codebase.zip

      # Each secret is passed explicitly, and only to this one step.
      - name: Populate secrets
        env:
          LIS_FTP_USERNAME: ${{ secrets.LIS_FTP_USERNAME }}
          LIS_FTP_PASSWORD: ${{ secrets.LIS_FTP_PASSWORD }}
          PDO_DSN: ${{ secrets.PDO_DSN }}
          PDO_DSN_STAGING: ${{ secrets.PDO_DSN_STAGING }}
          PDO_SERVER: ${{ secrets.PDO_SERVER }}
          PDO_USERNAME: ${{ secrets.PDO_USERNAME }}
          PDO_PASSWORD: ${{ secrets.PDO_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_DATABASE_STAGING: ${{ secrets.MYSQL_DATABASE_STAGING }}
          OPENSTATES_KEY: ${{ secrets.OPENSTATES_KEY }}
          OPENVA_KEY: ${{ secrets.OPENVA_KEY }}
          VA_DECODED_KEY: ${{ secrets.VA_DECODED_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MEMCACHED_SERVER: ${{ secrets.MEMCACHED_SERVER }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          API_URL: ${{ secrets.API_URL }}
          AWS_SES_SMTP_USERNAME: ${{ secrets.AWS_SES_SMTP_USERNAME }}
          AWS_SES_SMTP_PASSWORD: ${{ secrets.AWS_SES_SMTP_PASSWORD }}
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: bash deploy/config_variables.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1
          
      - name: Deploy to staging
        if: github.ref_name == 'master'
        run: |
          aws deploy push \
            --application-name RS-Web \
            --s3-location s3://deploy.richmondsunlight.com/rs-web-staging.zip \
            --no-ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Web \
            --deployment-group-name RS-Web-Staging \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-web-staging.zip,bundleType=zip

      - name: Deploy to production
        if: github.ref_name == 'deploy'
        run: |
          aws deploy push \
            --application-name RS-Web \
            --s3-location s3://deploy.richmondsunlight.com/rs-web-deploy.zip \
            --no-ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Web \
            --deployment-group-name RS-Web-Fleet \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-web-deploy.zip,bundleType=zip
