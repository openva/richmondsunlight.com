name: Deploy Process
permissions:
  contents: read
on:
  push:
    branches: [master, deploy]
  pull_request:
    branches: [master, deploy]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Redeploy at 4 AM every day

# Prevent multiple deployments running at once
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint_unit:
    name: Lint and Build Assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set branch name as env var
        run: echo "GITHUB_REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - uses: Firenza/secrets-to-env@v1.2.0
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, curl, memcached, redis

      - name: Ensure Composer cache dir exists
        run: mkdir -p ~/.composer/cache

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Ensure PHP syntax is valid
        run: find htdocs -name '*.php' -print0 | xargs -0 -n1 -P8 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache Yarn dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/yarn
            htdocs/js/vendor/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('htdocs/js/vendor/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Node dependencies
        working-directory: htdocs/js/vendor
        run: yarn install && yarn build

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: lint_unit
    steps:
      - uses: actions/checkout@v4

      - name: Set branch name as env var
        run: echo "GITHUB_REF_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - uses: Firenza/secrets-to-env@v1.2.0
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, curl, memcached, redis

      - name: Ensure Composer cache dir exists
        run: mkdir -p ~/.composer/cache

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache Yarn dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/yarn
            htdocs/js/vendor/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('htdocs/js/vendor/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Node dependencies
        working-directory: htdocs/js/vendor
        run: yarn install && yarn build

      - name: Determine API repo head
        id: api_ref
        run: echo "sha=$(git ls-remote https://github.com/openva/rs-api.git refs/heads/master | cut -f1)" >> $GITHUB_OUTPUT

      - name: Cache API checkout
        uses: actions/cache@v3
        with:
          path: api
          key: ${{ runner.os }}-api-${{ steps.api_ref.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-api-

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker images with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Web.Dockerfile
          push: false
          load: true
          tags: rs_web:ci
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Run Docker environment
        run: ./docker-run.sh

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: /tmp/pw-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('deploy/browser-tests/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run tests
        id: tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.ref_name }}" = "deploy" ]; }; then
            ./docker-tests.sh --zap-full-scan
          else
            ./docker-tests.sh
          fi

      - name: Stop Docker
        if: always()
        run: ./docker-stop.sh

      - name: Configure deployment type
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            ./deploy/increase_verbosity.sh
            cp appspec-staging.yml appspec.yml
            echo Deployment configured for staging
          elif [ "$GITHUB_REF_NAME" = "deploy" ]; then
            cp appspec-deploy.yml appspec.yml
            echo Deployment configured for production
          else
            echo "No deployment configuration for branch: $GITHUB_REF_NAME"
            exit 0
          fi

      - name: Populate secrets and compress
        run: |
          ./deploy/branch_deploy.sh
          ./deploy/config_variables.sh
          ./deploy/aws_credentials.sh
          zip -r codebase.zip . -x ".git/*"

      - name: Upload staging site
        if: env.GITHUB_REF_NAME == 'master'
        uses: actions/upload-artifact@v4
        with:
          name: codebase
          path: codebase.zip

      - name: Upload production site
        if: env.GITHUB_REF_NAME == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: codebase
          path: codebase.zip

  deploy:
    name: Deploy to AWS
    needs: [lint_unit, integration]
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: codebase
          path: .

      - name: Unzip codebase
        run: unzip codebase.zip
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1
          
      - name: Deploy to staging
        if: github.ref_name == 'master'
        run: |
          aws deploy push \
            --application-name RS-Web \
            --s3-location s3://deploy.richmondsunlight.com/rs-web-staging.zip \
            --no-ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Web \
            --deployment-group-name RS-Web-Staging \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-web-staging.zip,bundleType=zip

      - name: Deploy to production
        if: github.ref_name == 'deploy'
        run: |
          aws deploy push \
            --application-name RS-Web \
            --s3-location s3://deploy.richmondsunlight.com/rs-web-deploy.zip \
            --no-ignore-hidden-files
          aws deploy create-deployment \
            --application-name RS-Web \
            --deployment-group-name RS-Web-Fleet \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --s3-location bucket=deploy.richmondsunlight.com,key=rs-web-deploy.zip,bundleType=zip
