---
version: 0
os: linux
files:
  - source: ./
    destination: /var/www/richmondsunlight.com/
file_exists_behavior: OVERWRITE
permissions:
  - object: /var/www/richmondsunlight.com/
    owner: ubuntu
    group: www-data
    mode: 755
    type:
      - directory
  - object: /var/www/richmondsunlight.com/
    owner: ubuntu
    group: www-data
    mode: 755
    type:
      - file
hooks:
  BeforeInstall:
    - location: deploy/predeploy.sh
      timeout: 300
      runas: root
  Install: []
  AfterInstall:
    - location: deploy/postdeploy.sh
      runas: root
