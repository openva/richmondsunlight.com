---
version: 0
os: linux
files:
  - source: ./
    destination: /var/www/richmondsunlight.com/
file_exists_behavior: OVERWRITE
permissions:
  - object: /var/www/richmondsunlight.com/
    owner: ubuntu
    group: www-data
    mode: 755
    acls:
      - "d:u::rwx"
      - "d:g::rx"
      - "d:o::rx"
    type:
      - directory
  - object: /var/www/richmondsunlight.com/
    owner: ubuntu
    group: www-data
    mode: 755
    type:
      - file
hooks:
  BeforeInstall:
    - location: deploy/predeploy.sh
      timeout: 300
      runas: root
  Install:
    - location: deploy/install-log.sh
      runas: root
  AfterInstall:
    - location: deploy/postdeploy.sh
      runas: root
