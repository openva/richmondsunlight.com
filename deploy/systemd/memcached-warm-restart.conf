# Lets Memcached's contents (sessions, above all) survive a restart or reboot. Memcached keeps its
# data in the file named by -e in /etc/memcached.conf, and on SIGUSR1 it saves its state there and
# exits, then reloads it on the next start. This sends SIGUSR1 instead of systemd's usual SIGTERM.
# It waits for Memcached to exit, because once ExecStop finishes, systemd kills whatever is left,
# which would cut off the save. Nothing is saved if Memcached crashes or is killed, or if its
# settings (like -m) change before it starts again; then it starts empty, as it always used to.
# Installed by deploy/postdeploy.sh as /etc/systemd/system/memcached.service.d/warm-restart.conf.

[Service]
ExecStop=/bin/sh -c 'kill -USR1 "$MAINPID" && exec tail --pid="$MAINPID" -f /dev/null'
TimeoutStopSec=60
